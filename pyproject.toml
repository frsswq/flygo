[project]
name = "flygo"
version = "0.1.0"
description = "Test whether the official MaleCNS connectome can provide useful structure for learning standard 19x19 Go."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "FlyGo contributors" }]
dependencies = [
  "fastapi[standard]>=0.128.0",
  "numpy>=2.2.0",
  "polars>=1.37.0",
  "pyarrow>=25.0.1",
  "sgfmill>=1.1.1",
]

[project.scripts]
flygo = "flygo.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.40.1",
  "httpx>=0.28.0",
  "pytest>=9.0.0",
  "ruff>=0.14.0",
  "vulture>=2.14",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "flygo.api:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.vulture]
# 60 is the confidence vulture assigns to unused functions, methods, and
# classes. Its 80 default hides them, which would make the check useless.
min_confidence = 60
paths = ["src", "tests"]
exclude = ["web"]
# Called by pydantic at runtime, or part of the documented response schema or
# the planned baseline and readout surface.
ignore_names = [
  "check_moves",
  "check_last_move",
  "comparison_table",
  "fit_readout",
  "linear_baseline_logits",
  "model_status",
  "neuron_type",
  "ruleset",
  "superclass",
  "topology",
  # Research dataclass fields are serialized through dataclasses.asdict.
  "changed_target_edges",
  "trainable_parameters",
  "optimizer_updates",
  "selected_epoch",
  "edge_accumulations_per_evaluation",
  "peak_traced_bytes",
  "evaluation_seconds_per_example",
]
